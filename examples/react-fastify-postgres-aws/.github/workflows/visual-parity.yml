name: Visual Parity Tests

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  visual-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: Start application
        run: |
          npm start &
          echo $! > server.pid
        env:
          PORT: 3000
      
      - name: Wait for application to be ready
        uses: nev7n/wait_for_response@v1
        with:
          url: 'http://localhost:3000'
          responseCode: 200
          timeout: 60000
          interval: 2000
      
      - name: Capture production screenshots
        run: npm run capture:production
        continue-on-error: true
        env:
          PROD_USERNAME: ${{ secrets.VISUAL_TEST_USERNAME }}
          PROD_PASSWORD: ${{ secrets.VISUAL_TEST_PASSWORD }}
      
      - name: Capture local screenshots
        run: npm run capture:local
        continue-on-error: true
      
      - name: Compare screenshots
        id: compare
        run: npm run compare
        continue-on-error: true
      
      - name: Upload visual test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-parity-results
          path: visual-tests/
          retention-days: 30
      
      - name: Parse results
        id: parse
        if: always()
        run: |
          if [ -f visual-tests/diff/results.json ]; then
            TOTAL=$(jq '.summary.total' visual-tests/diff/results.json)
            PASSED=$(jq '.summary.passed' visual-tests/diff/results.json)
            FAILED=$(jq '.summary.failed' visual-tests/diff/results.json)
            IDENTICAL=$(jq '.summary.identical' visual-tests/diff/results.json)
            
            echo "total=$TOTAL" >> $GITHUB_OUTPUT
            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "identical=$IDENTICAL" >> $GITHUB_OUTPUT
          else
            echo "total=0" >> $GITHUB_OUTPUT
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
            echo "identical=0" >> $GITHUB_OUTPUT
          fi
      
      - name: Comment on PR
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request'
        with:
          script: |
            const total = '${{ steps.parse.outputs.total }}';
            const passed = '${{ steps.parse.outputs.passed }}';
            const failed = '${{ steps.parse.outputs.failed }}';
            const identical = '${{ steps.parse.outputs.identical }}';
            
            const status = failed === '0' ? '✅ PASSED' : '❌ FAILED';
            const emoji = failed === '0' ? '✅' : '❌';
            
            let body = `## ${emoji} Visual Parity Test Results\n\n`;
            body += `**Status:** ${status}\n\n`;
            body += `| Metric | Count |\n`;
            body += `|--------|-------|\n`;
            body += `| Total Comparisons | ${total} |\n`;
            body += `| Passed | ${passed} ✅ |\n`;
            body += `| Failed | ${failed} ❌ |\n`;
            body += `| Identical | ${identical} |\n\n`;
            
            if (failed !== '0') {
              body += `### ⚠️ Visual Differences Detected\n\n`;
              body += `Review the full report in the workflow artifacts.\n\n`;
            } else {
              body += `### ✅ All Visual Comparisons Passed\n\n`;
              body += `Local environment matches production perfectly!\n\n`;
            }
            
            body += `[View Full Report](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
      
      - name: Stop application
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi
      
      - name: Fail if visual differences
        if: steps.parse.outputs.failed != '0'
        run: |
          echo "❌ Visual parity tests failed"
          echo "Failed: ${{ steps.parse.outputs.failed }} comparison(s)"
          exit 1
